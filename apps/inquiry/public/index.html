<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>問い合わせ管理システム</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>問い合わせ管理システム</h1>
  </header>

  <div class="info">
    TypeScript / Node.js / Express / MySQL を用いた問い合わせ管理システムを個人開発。
    <br>問い合わせ一覧・詳細表示・編集・更新などのCRUD機能を実装し、Docker化したアプリをAWS EC2上で稼働。
    <br>データベースにはAmazon RDS for MySQLを使用し、NginxによるリバースプロキシとHTTPS化まで行いました。
  </div>

  <main>
    <section id="form-section">
      <h2 id="form-title">新規登録</h2>
      <form id="inquiry-form">
        <input type="hidden" id="inquiry-id" />
        <div class="field">
          <label for="name">名前</label>
          <input type="text" id="name" required maxlength="100" />
        </div>
        <div class="field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" required maxlength="255" />
        </div>
        <div class="field">
          <label for="subject">件名</label>
          <input type="text" id="subject" required maxlength="255" />
        </div>
        <div class="field">
          <label for="message">内容</label>
          <textarea id="message" required rows="4"></textarea>
        </div>
        <div class="field" id="status-field" hidden>
          <label for="status">ステータス</label>
          <select id="status">
            <option value="unread">未対応</option>
            <option value="in_progress">対応中</option>
            <option value="done">対応済み</option>
          </select>
        </div>
        <div class="actions">
          <button type="submit" id="submit-button">登録</button>
          <button type="button" id="cancel-button" hidden>キャンセル</button>
        </div>
      </form>
      <p id="form-error" class="error" hidden></p>
    </section>

    <section id="list-section">
      <h2>問い合わせ一覧</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>名前</th>
            <th>件名</th>
            <th>ステータス</th>
            <th>登録日時</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="inquiry-list"></tbody>
      </table>
      <div class="pagination">
        <button type="button" id="prev-page">前へ</button>
        <span id="page-info"></span>
        <button type="button" id="next-page">次へ</button>
      </div>
    </section>

    <section id="detail-section" hidden>
      <h2>詳細</h2>
      <dl id="detail-content"></dl>
      <button type="button" id="close-detail">閉じる</button>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
