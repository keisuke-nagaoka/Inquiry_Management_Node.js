services:
  nginx:
    image: nginx
    container_name: node_nginx
    ports:
      - "9200:80"
      - "9643:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/server.crt:/etc/nginx/ssl/server.crt
      - ./docker/nginx/server.key:/etc/nginx/ssl/server.key
    depends_on:
      - inquiry-api

  inquiry-api:
    container_name: inquiry-api
    build:
      context: ./docker/node
    working_dir: /app
    volumes:
      - ./apps/inquiry:/app
      - inquiry_node_modules:/app/node_modules
    env_file:
      - ./apps/inquiry/.env
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: inquiry_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inquiry_db
      MYSQL_USER: inquiry_user
      MYSQL_PASSWORD: inquiry_pass
      TZ: "Asia/Tokyo"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 新しいNode.jsアプリを追加する場合はここに1ブロック追加し、
  # docker/nginx/default.conf にも対応するupstream/locationを追加する
  # other-api:
  #   container_name: other-api
  #   build:
  #     context: ./docker/node
  #   working_dir: /app
  #   volumes:
  #     - ./apps/other:/app
  #     - other_node_modules:/app/node_modules
  #   command: sh -c "npm install && npm run dev"

volumes:
  inquiry_node_modules:
