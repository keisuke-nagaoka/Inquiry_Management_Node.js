# アプリごとのupstream。新しいアプリを追加したらここに追記する
upstream inquiry_api {
    server inquiry-api:3000;
}
# upstream other_api {
#     server other-api:3000;
# }

server {
    listen 80;
    server_name node.keisuke-nagaoka.com;

    location = /inquiry {
        return 301 /inquiry/;
    }

    location /inquiry/ {
        proxy_pass http://inquiry_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name node.keisuke-nagaoka.com;

    # 自己署名証明書ではなく、Let's Encrypt等の正式な証明書に差し替える
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    location = /inquiry {
        return 301 /inquiry/;
    }

    location /inquiry/ {
        proxy_pass http://inquiry_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
