# アプリごとのupstream。新しいアプリを追加したらここに追記する
upstream inquiry_api {
    server inquiry-api:3000;
}
# upstream other_api {
#     server other-api:3000;
# }

server {
    listen 80;
    server_name localhost;

    # 末尾スラッシュなしでアクセスされた場合はリダイレクトして統一する
    location = /inquiry {
        return 301 /inquiry/;
    }

    # 本番(node.keisuke-nagaoka.com)と同じく、パス単位でアプリを振り分ける
    location /inquiry/ {
        proxy_pass http://inquiry_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # location = /other {
    #     return 301 /other/;
    # }
    # location /other/ {
    #     proxy_pass http://other_api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    location = /inquiry {
        return 301 /inquiry/;
    }

    location /inquiry/ {
        proxy_pass http://inquiry_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # location = /other {
    #     return 301 /other/;
    # }
    # location /other/ {
    #     proxy_pass http://other_api/;
    #     proxy_set_header Host $host;
